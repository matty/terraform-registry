---
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terraform-registry-app-dev
    ports:
      - "5131:80"
      - "5132:443"
    volumes:
      - module_data:/app/modules
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - TF_REG_DatabaseProvider=postgres
      - TF_REG_PostgreSQL__ConnectionString=Host=postgres;Database=terraform_registry;Username=terraform_reg_user;Password=terraform_reg_password
      - TF_REG_BaseUrl=http://localhost:5131
      - TF_REG_StorageProvider=local
      - TF_REG_EnableSwagger=true
      # Example only: set this to a unique 32+ character value if overriding the dev default.
      # - TF_REG_OIDC__JWTSECRETKEY=replace-with-a-unique-32-character-secret
      - TF_REG_OIDC__PROVIDERS__GITHUB__CLIENTID=
      - TF_REG_OIDC__PROVIDERS__GITHUB__CLIENTSECRET=
      - TF_REG_OIDC__PROVIDERS__GITHUB__ENABLED=true
      - TF_REG_OIDC__PROVIDERS__AZUREAD__ENABLED=true
      - TF_REG_AUTHORIZATIONTOKEN=MY_TOKEN_123
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18@sha256:48ebba8b80dc3be58b5ae431f47a33535289959cddfe13f5f887298de959fae0
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql
    environment:
      POSTGRES_USER: terraform_reg_user
      POSTGRES_PASSWORD: terraform_reg_password
      POSTGRES_DB: terraform_registry
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U terraform_reg_user -d terraform_registry"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest@sha256:40fa840c5bb7c8463957f1255b01283732c2d8c9396a956d180f8e6c296753b3
    container_name: terraform-registry-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - ./devutils/pgadmin/servers/servers.json:/pgadmin4/servers.json
      - pgpassfile_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data_dev:
  pgpassfile_data:
  module_data:

name: Build and Publish Docker Image

on:
  workflow_run:
    workflows: ["Run Tests"]
    types:
      - completed
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override"
        required: false
        type: string
      push_image:
        description: "Push image to GHCR"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    # Only run if tests passed (or if manually triggered)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          fetch-depth: 0 # Required for GitVersion

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.10.2
        with:
          versionSpec: "5.x"

      - name: Determine Version
        id: set-version
        uses: gittools/actions/gitversion/execute@v0.10.2
        with:
          useConfigFile: true

      - name: Resolve Version
        id: resolved-version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ steps.set-version.outputs.semVer }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.push_image) ||
          (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch != '' && !startsWith(github.event.workflow_run.event, 'pull_request'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine push flag
        id: push-flag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "push=${{ inputs.push_image }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.workflow_run.event }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ steps.push-flag.outputs.push }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/terraform-registry:${{ env.VERSION }}
            ${{ github.event.workflow_run.head_branch == 'main' && format('ghcr.io/{0}/terraform-registry:latest', github.repository_owner) || '' }}
            ${{ github.event.workflow_run.head_branch == 'develop' && format('ghcr.io/{0}/terraform-registry:develop', github.repository_owner) || '' }}
            ${{ startsWith(github.event.workflow_run.head_branch || '', 'release/') && format('ghcr.io/{0}/terraform-registry:release', github.repository_owner) || '' }}

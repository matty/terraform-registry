name: Renovate

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate dependency updates
    runs-on: ubuntu-latest
    env:
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}

    steps:
      - name: Check Renovate token
        if: env.RENOVATE_TOKEN == ''
        run: echo "::notice::Set the RENOVATE_TOKEN repository secret to enable scheduled Renovate pull requests."

      - name: Checkout code
        if: env.RENOVATE_TOKEN != ''
        uses: actions/checkout@v6

      - name: Self-hosted Renovate
        if: env.RENOVATE_TOKEN != ''
        uses: renovatebot/github-action@v46.1.11
        with:
          configurationFile: .github/renovate-config.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: info
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_REPOSITORY_CACHE: enabled

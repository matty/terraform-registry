name: CI

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
      - develop
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Immutable 40-character commit SHA to certify"
        required: true
        type: string
      candidate_ref:
        description: "Candidate branch, tag, or source reference for evidence"
        required: true
        type: string
      version:
        description: "Optional version override"
        required: false
        type: string
      push_image:
        description: "Push image to GHCR"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIGURATION: Release
  DOTNET_VERSION: "10.0.400"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/terraform-registry
  NODE_VERSION: "24"
  SCAN_IMAGE_NAME: terraform-registry:${{ github.sha }}
  TEST_RESULTS_DIR: TerraformRegistry.Tests/TestResults

jobs:
  dotnet:
    name: .NET build, test, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies with NuGet audit
        run: |
          dotnet restore \
            -p:NuGetAudit=true \
            -p:NuGetAuditMode=all \
            -p:NuGetAuditLevel=high \
            "-warnaserror:NU1903;NU1904"

      - name: Build solution
        run: dotnet build --no-restore --configuration "$CONFIGURATION"

      - name: Run tests with coverage
        run: |
          mkdir -p "$TEST_RESULTS_DIR"
          dotnet test TerraformRegistry.Tests/TerraformRegistry.Tests.csproj \
            --no-build \
            --configuration "$CONFIGURATION" \
            --logger "trx;LogFileName=test_results.trx" \
            --results-directory "$TEST_RESULTS_DIR" \
            --collect "XPlat Code Coverage" \
            --blame-hang \
            --blame-hang-timeout 5m \
            -- \
            DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
        env:
          ASPNETCORE_ENVIRONMENT: Test

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results
          path: ${{ env.TEST_RESULTS_DIR }}/*.trx
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: code-coverage-report
          path: ${{ env.TEST_RESULTS_DIR }}/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        if: env.CODECOV_TOKEN != ''
        with:
          files: ${{ env.TEST_RESULTS_DIR }}/**/coverage.cobertura.xml
          flags: dotnet
          name: dotnet-tests
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    name: Frontend build and audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: TerraformRegistry/web-src/package-lock.json

      - name: Install frontend dependencies
        working-directory: TerraformRegistry/web-src
        run: npm ci

      - name: Verify reproducible release inputs
        run: bash scripts/verification/gates/test-supply-chain-pinning.sh

      - name: Run npm audit
        working-directory: TerraformRegistry/web-src
        run: npm audit --audit-level=high

      - name: Generate frontend
        working-directory: TerraformRegistry/web-src
        run: npm run generate

      - name: Upload generated frontend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: generated-frontend
          path: TerraformRegistry/web-src/.output/public
          if-no-files-found: error
          retention-days: 7

  release-runbooks-gate:
    name: Release runbooks gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Verify release runbook contracts and mutation coverage
        run: |
          bash scripts/verification/gates/release-runbooks.sh
          bash scripts/verification/gates/test-release-runbooks-gate.sh

  storage-emulator-contract:
    name: Storage emulator Terraform contract
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Verify storage emulator harness scripts
        run: |
          bash scripts/verification/storage-emulators/test-lifecycle.sh
          bash scripts/verification/storage-emulators/test-ci-workflow.sh
          bash scripts/verification/storage-emulators/test-smoke-script.sh

      - name: Run Azurite and MinIO Terraform contract smoke
        run: >-
          bash scripts/verification/phase-1-storage-emulator-terraform-smoke.sh
          --provider all
          --home "$RUNNER_TEMP/terraform-registry-storage-test"

      - name: Collect storage emulator logs
        if: failure()
        run: |
          harness="$RUNNER_TEMP/terraform-registry-storage-test"
          project="tfregstorage$(printf '%s' "$harness" | sha256sum | cut -c1-12)"
          docker compose --project-name "$project" --project-directory "$harness" -f "$harness/compose.yaml" logs --no-color > storage-emulator-compose.log || true

      - name: Upload storage emulator logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: storage-emulator-compose-logs
          path: storage-emulator-compose.log
          if-no-files-found: warn
          retention-days: 14

      - name: Clean storage emulator harness
        if: always()
        run: >-
          bash scripts/verification/storage-emulators/storage-emulators.sh clean
          --home "$RUNNER_TEMP/terraform-registry-storage-test" || true

  terraform-backend-matrix:
    name: Terraform backend certification matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Verify Terraform backend matrix contract
        run: bash scripts/verification/test-terraform-backend-matrix.sh

      - name: Run pinned Terraform backend matrix
        run: >-
          bash scripts/verification/terraform-backend-matrix.sh
          --home "$RUNNER_TEMP/terraform-registry-terraform-matrix"

      - name: Clean Terraform backend matrix harness
        if: always()
        run: >-
          bash scripts/verification/storage-emulators/storage-emulators.sh clean
          --home "$RUNNER_TEMP/terraform-registry-terraform-matrix/terraform-1.12.0" || true;
          bash scripts/verification/storage-emulators/storage-emulators.sh clean
          --home "$RUNNER_TEMP/terraform-registry-terraform-matrix/terraform-1.14.2" || true

  final-candidate-certification:
    name: Pre-publication candidate verification
    # A release manager labels a same-repository final PR `final-candidate`,
    # or explicitly supplies the immutable candidate identity by dispatch.
    # Merge-group refs are synthetic and deliberately cannot certify a release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'final-candidate'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Validate immutable candidate inputs
        id: candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha }}
          CANDIDATE_REF: ${{ inputs.candidate_ref || (github.event_name == 'pull_request' && format('refs/heads/{0}', github.event.pull_request.head.ref)) }}
        run: |
          # shellcheck disable=SC2153 # supplied through the step-level env map
          candidate_sha="$CANDIDATE_SHA"
          # shellcheck disable=SC2153 # supplied through the step-level env map
          candidate_ref="$CANDIDATE_REF"
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'candidate_sha must be an immutable 40-character lowercase commit SHA.' >&2
            exit 1
          }
          test -n "$candidate_ref" || {
            echo 'candidate_ref must identify the candidate source.' >&2
            exit 1
          }
          [[ "$candidate_ref" == refs/heads/* || "$candidate_ref" == refs/tags/* ]] || {
            echo 'candidate_ref must be a canonical refs/heads/* or refs/tags/* reference.' >&2
            exit 1
          }
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "ref=$candidate_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ steps.candidate.outputs.sha }}

      - name: Validate candidate reference provenance
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CANDIDATE_REF: ${{ steps.candidate.outputs.ref }}
        run: |
          git check-ref-format "$CANDIDATE_REF"
          case "$CANDIDATE_REF" in
            refs/heads/*|refs/tags/*) ;;
            *)
              echo 'candidate_ref must be a canonical refs/heads/* or refs/tags/* reference.' >&2
              exit 1
              ;;
          esac
          git fetch --no-tags origin "$CANDIDATE_REF"
          resolved_ref_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          [[ "$resolved_ref_sha" == "$CANDIDATE_SHA" ]] || {
            echo 'candidate_ref does not resolve to the requested immutable candidate SHA.' >&2
            exit 1
          }

      - name: Verify immutable candidate checkout
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          [[ "$checked_out_sha" == "$CANDIDATE_SHA" ]] || {
            echo 'checkout did not resolve the requested immutable candidate SHA.' >&2
            exit 1
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve candidate version
        id: candidate-version
        env:
          GITHUB_REF_TYPE: branch
          GITHUB_REF_NAME: ${{ steps.candidate.outputs.ref }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          version="$(.github/scripts/resolve-version.sh)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify pre-publication candidate verification wiring
        run: bash scripts/verification/gates/test-final-candidate-certification.sh

      - name: Run pre-publication candidate verification
        env:
          FINAL_CANDIDATE_VERSION: ${{ steps.candidate-version.outputs.version }}
          FINAL_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          FINAL_CANDIDATE_REF: ${{ steps.candidate.outputs.ref }}
        run: |
          FINAL_CANDIDATE_EVIDENCE_PATH="$RUNNER_TEMP/final-candidate-certification-evidence.json" \
          env -u GITHUB_SHA -u GITHUB_REF \
          bash scripts/verification/gates/final-candidate-certification.sh

      - name: Verify and bind pre-publication evidence provenance
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CANDIDATE_REF: ${{ steps.candidate.outputs.ref }}
          EVIDENCE_PATH: ${{ runner.temp }}/final-candidate-certification-evidence.json
        run: |
          artifact_sha="$(jq -er '.candidate_sha | strings' "$EVIDENCE_PATH")"
          [[ "$artifact_sha" == "$CANDIDATE_SHA" ]] || {
            echo 'Pre-publication evidence candidate_sha does not match the explicit candidate SHA.' >&2
            exit 1
          }

          case "$CANDIDATE_REF" in
            refs/heads/*|refs/tags/*) ;;
            *)
              echo 'Pre-publication evidence requires a canonical candidate ref.' >&2
              exit 1
              ;;
          esac

          stamped_evidence="$(mktemp "${EVIDENCE_PATH}.XXXXXX")"
          trap 'rm -f "$stamped_evidence"' EXIT
          jq --arg candidate_ref "$CANDIDATE_REF" '.candidate_ref = $candidate_ref' "$EVIDENCE_PATH" > "$stamped_evidence"
          mv "$stamped_evidence" "$EVIDENCE_PATH"
          trap - EXIT

          artifact_ref="$(jq -er '.candidate_ref | strings' "$EVIDENCE_PATH")"
          [[ "$artifact_ref" == "$CANDIDATE_REF" ]] || {
            echo 'Pre-publication evidence candidate_ref does not match the explicit canonical candidate ref.' >&2
            exit 1
          }

      - name: Upload pre-publication candidate verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pre-publication-candidate-verification-evidence
          path: ${{ runner.temp }}/final-candidate-certification-evidence.json
          if-no-files-found: error
          retention-days: 90

  docker:
    name: Docker build and scan
    needs:
      - dotnet
      - frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Test version resolver
        run: bash .github/scripts/test-resolve-version.sh

      - name: Resolve version
        id: resolved-version
        run: |
          VERSION="$(.github/scripts/resolve-version.sh "${{ inputs.version }}")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=terraform-registry
            org.opencontainers.image.description=Private Terraform module registry
          tags: |
            type=raw,value=${{ steps.resolved-version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=release,enable=${{ startsWith(github.ref, 'refs/heads/release/') }}

      - name: Build Docker image for scan
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: ${{ env.SCAN_IMAGE_NAME }}
          build-args: |
            FRONTEND_BUILD_MARKER=frontend-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify frontend marker in image
        run: |
          expected="frontend-${{ github.sha }}"
          actual="$(docker run --rm --entrypoint cat "${{ env.SCAN_IMAGE_NAME }}" /app/web/.build-marker)"
          test "$actual" = "$expected"

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SCAN_IMAGE_NAME }}
          format: sarif
          output: trivy-image.sarif
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          limit-severities-for-sarif: true

      - name: Upload Trivy image scan
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        if: always() && hashFiles('trivy-image.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  publish-image:
    name: Publish Docker image
    needs:
      - dotnet
      - frontend
      - docker
    # PRs, merge-queue candidates, and remediation-phase branches are deliberately
    # ineligible for registry credentials.  Only integration/release pushes (or an
    # explicitly requested manual publication) may receive package write access.
    if: >-
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/develop' ||
         startsWith(github.ref, 'refs/heads/release/') ||
         startsWith(github.ref, 'refs/heads/hotfix/'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.push_image)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Resolve version
        id: resolved-version
        run: |
          VERSION="$(.github/scripts/resolve-version.sh "${{ inputs.version }}")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=terraform-registry
            org.opencontainers.image.description=Private Terraform module registry
          tags: |
            type=raw,value=${{ steps.resolved-version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=release,enable=${{ startsWith(github.ref, 'refs/heads/release/') }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            FRONTEND_BUILD_MARKER=frontend-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Create CalVer tag for main release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git tag "v${{ steps.resolved-version.outputs.version }}"
          git push origin "v${{ steps.resolved-version.outputs.version }}"

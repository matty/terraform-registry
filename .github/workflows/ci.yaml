name: CI

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
      - "remediation/phase/**"
  pull_request:
    branches:
      - main
      - develop
      - "remediation/phase/**"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override"
        required: false
        type: string
      push_image:
        description: "Push image to GHCR"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIGURATION: Release
  DOTNET_VERSION: "10.0.x"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/terraform-registry
  NODE_VERSION: "24"
  SCAN_IMAGE_NAME: terraform-registry:${{ github.sha }}
  TEST_RESULTS_DIR: TerraformRegistry.Tests/TestResults

jobs:
  dotnet:
    name: .NET build, test, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies with NuGet audit
        run: |
          dotnet restore \
            -p:NuGetAudit=true \
            -p:NuGetAuditMode=all \
            -p:NuGetAuditLevel=high \
            "-warnaserror:NU1903;NU1904"

      - name: Build solution
        run: dotnet build --no-restore --configuration "$CONFIGURATION"

      - name: Run tests with coverage
        run: |
          mkdir -p "$TEST_RESULTS_DIR"
          dotnet test TerraformRegistry.Tests/TerraformRegistry.Tests.csproj \
            --no-build \
            --configuration "$CONFIGURATION" \
            --logger "trx;LogFileName=test_results.trx" \
            --results-directory "$TEST_RESULTS_DIR" \
            --collect "XPlat Code Coverage" \
            --blame-hang \
            --blame-hang-timeout 5m \
            -- \
            DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
        env:
          ASPNETCORE_ENVIRONMENT: Test

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: ${{ env.TEST_RESULTS_DIR }}/*.trx
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: code-coverage-report
          path: ${{ env.TEST_RESULTS_DIR }}/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        if: env.CODECOV_TOKEN != ''
        with:
          files: ${{ env.TEST_RESULTS_DIR }}/**/coverage.cobertura.xml
          flags: dotnet
          name: dotnet-tests
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    name: Frontend build and audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: TerraformRegistry/web-src/package-lock.json

      - name: Install frontend dependencies
        working-directory: TerraformRegistry/web-src
        run: npm ci

      - name: Run npm audit
        working-directory: TerraformRegistry/web-src
        run: npm audit --audit-level=high

      - name: Generate frontend
        working-directory: TerraformRegistry/web-src
        run: npm run generate

      - name: Upload generated frontend
        uses: actions/upload-artifact@v7
        with:
          name: generated-frontend
          path: TerraformRegistry/web-src/.output/public
          if-no-files-found: error
          retention-days: 7

  storage-emulator-contract:
    name: Storage emulator Terraform contract
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify storage emulator harness scripts
        run: |
          bash scripts/remediation/storage-emulators/test-lifecycle.sh
          bash scripts/remediation/storage-emulators/test-ci-workflow.sh
          bash scripts/remediation/storage-emulators/test-smoke-script.sh

      - name: Run Azurite and MinIO Terraform contract smoke
        run: >-
          bash scripts/remediation/phase-1-storage-emulator-terraform-smoke.sh
          --provider all
          --home "$RUNNER_TEMP/terraform-registry-storage-test"

      - name: Collect storage emulator logs
        if: failure()
        run: |
          harness="$RUNNER_TEMP/terraform-registry-storage-test"
          project="tfregstorage$(printf '%s' "$harness" | sha256sum | cut -c1-12)"
          docker compose --project-name "$project" --project-directory "$harness" -f "$harness/compose.yaml" logs --no-color > storage-emulator-compose.log || true

      - name: Upload storage emulator logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: storage-emulator-compose-logs
          path: storage-emulator-compose.log
          if-no-files-found: warn
          retention-days: 14

      - name: Clean storage emulator harness
        if: always()
        run: >-
          bash scripts/remediation/storage-emulators/storage-emulators.sh clean
          --home "$RUNNER_TEMP/terraform-registry-storage-test" || true

  phase-1-deployment-gate:
    name: Phase 1 deployment gate
    if: github.event_name == 'pull_request' && github.head_ref == 'test/audit-p1-terraform-deployment-gate'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run portable Phase 1 deployment gate
        run: bash scripts/remediation/gates/phase-1.sh

  bounded-ingestion-security-gate:
    name: Bounded ingestion security gate
    if: github.event_name == 'pull_request' && github.head_ref == 'test/audit-p2-security-abuse-gate'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run bounded ingestion security gate
        run: bash scripts/remediation/gates/bounded-ingestion-security.sh

  mirror-containment-gate:
    name: Mirror containment gate
    if: github.event_name == 'pull_request' && github.head_ref == 'test/mirror-containment-gate'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run mirror containment gate
        run: bash scripts/remediation/gates/mirror-containment-gate.sh

  docker:
    name: Docker build and scan
    needs:
      - dotnet
      - frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Test version resolver
        run: bash .github/scripts/test-resolve-version.sh

      - name: Resolve version
        id: resolved-version
        run: |
          VERSION="$(.github/scripts/resolve-version.sh "${{ inputs.version }}")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=terraform-registry
            org.opencontainers.image.description=Private Terraform module registry
          tags: |
            type=raw,value=${{ steps.resolved-version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=release,enable=${{ startsWith(github.ref, 'refs/heads/release/') }}

      - name: Build Docker image for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.SCAN_IMAGE_NAME }}
          build-args: |
            FRONTEND_BUILD_MARKER=frontend-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify frontend marker in image
        run: |
          expected="frontend-${{ github.sha }}"
          actual="$(docker run --rm --entrypoint cat "${{ env.SCAN_IMAGE_NAME }}" /app/web/.build-marker)"
          test "$actual" = "$expected"

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.SCAN_IMAGE_NAME }}
          format: sarif
          output: trivy-image.sarif
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          limit-severities-for-sarif: true

      - name: Upload Trivy image scan
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-image.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  publish-image:
    name: Publish Docker image
    needs:
      - dotnet
      - frontend
      - docker
    # PRs, merge-queue candidates, and remediation-phase branches are deliberately
    # ineligible for registry credentials.  Only integration/release pushes (or an
    # explicitly requested manual publication) may receive package write access.
    if: >-
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/develop' ||
         startsWith(github.ref, 'refs/heads/release/') ||
         startsWith(github.ref, 'refs/heads/hotfix/'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.push_image)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve version
        id: resolved-version
        run: |
          VERSION="$(.github/scripts/resolve-version.sh "${{ inputs.version }}")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=terraform-registry
            org.opencontainers.image.description=Private Terraform module registry
          tags: |
            type=raw,value=${{ steps.resolved-version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=release,enable=${{ startsWith(github.ref, 'refs/heads/release/') }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            FRONTEND_BUILD_MARKER=frontend-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Create CalVer tag for main release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git tag "v${{ steps.resolved-version.outputs.version }}"
          git push origin "v${{ steps.resolved-version.outputs.version }}"

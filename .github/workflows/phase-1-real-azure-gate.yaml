name: Phase 1 real Azure gate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  user-delegation-sas:
    name: Azure user-delegation SAS
    runs-on: ubuntu-latest
    environment: remediation-azure-phase-1
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure user-delegation SAS
        env:
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
        run: bash scripts/remediation/gates/phase-1-real-azure-user-delegation-sas.sh
